name: "EDEN public npm tarball smoke"

on:
  pull_request:
    paths: [".github/workflows/remote-npm-smoke.yml"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-npm-entry:
    name: "Public npm exec on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve and run public GitHub tarball via npm
        shell: bash
        run: |
          npm exec --yes --package=https://github.com/EDEN-STREET/LAPTOP-OS/archive/refs/heads/main.tar.gz -- eden doctor --json > eden-doctor.json
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('eden-doctor.json','utf8'));if(v.can_preview!==true||v.os_installed!==false||v.hardware_verified!==false)process.exit(1);console.log('EDEN npm public tarball: verified preview only')"
      - name: Review package command status
        shell: bash
        run: |
          node --version
          npm --version
          echo "No operating-system, disk, firewall or firmware operations executed."
